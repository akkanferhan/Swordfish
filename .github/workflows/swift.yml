# CI: generate the Xcode project with XcodeGen and build the app.
# This is an xcodeproj app (no Package.swift), so `swift build` does not apply.

name: Build

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Swordfish
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project Swordfish/Swordfish.xcodeproj \
            -scheme Swordfish \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
